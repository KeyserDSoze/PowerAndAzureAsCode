name: Deploy Power Apps Code App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: choice
        options: [development, test, production]
        default: development
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy-powerapps.yml"

concurrency:
  group: powerplatform-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POWERAPPS_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'development' }}
    env:
      PA_CLI_USE_SP_AUTH: "true"
      PA_CLI_SP_CLIENT_ID: ${{ vars.POWERAPPS_CLIENT_ID }}
      PA_CLI_SP_TENANT_ID: ${{ vars.POWERAPPS_TENANT_ID }}
      PA_CLI_SP_CLIENT_SECRET: ${{ secrets.POWERAPPS_CLIENT_SECRET }}
      POWERAPPS_SOLUTION_ID: ${{ vars.POWERAPPS_SOLUTION_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify locked Power Apps CLI
        working-directory: src/frontend
        run: npx --no-install pa --version
      - run: npm run build:powerapps
      - name: Validate initialized Code App
        run: test -f src/frontend/power.config.json || (echo "Run 'pa app init' in src/frontend and commit power.config.json in the derived application repository." && exit 1)
      - name: Publish
        working-directory: src/frontend
        shell: bash
        run: |
          if [ -n "$POWERAPPS_SOLUTION_ID" ]; then
            npx --no-install pa app push --non-interactive --solution-id "$POWERAPPS_SOLUTION_ID"
          else
            npx --no-install pa app push --non-interactive
          fi
