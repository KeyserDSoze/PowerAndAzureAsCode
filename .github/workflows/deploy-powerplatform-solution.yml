name: Deploy Power Platform Solution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: choice
        options: [development, test, production]
        default: development
  push:
    branches: [main]
    paths:
      - "src/backends/dataverse/**"
      - ".github/workflows/deploy-powerplatform-solution.yml"

concurrency:
  group: powerplatform-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POWERPLATFORM_SOLUTION_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'development' }}
    env:
      SOLUTION_ROOT: ${{ vars.POWERPLATFORM_SOLUTION_PATH || 'src/backends/dataverse/solution' }}
      PACKAGE_TYPE: ${{ vars.POWERPLATFORM_SOLUTION_PACKAGE_TYPE || 'unmanaged' }}
      SETTINGS_FILE: ${{ vars.POWERPLATFORM_SOLUTION_SETTINGS_FILE }}
      PLUGIN_PACKAGE_ID: ${{ vars.POWERPLATFORM_PLUGIN_PACKAGE_ID }}
      PLUGIN_PROJECT: src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/PowerAndAzureAsCode.Dataverse.Plugins.csproj
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@0e44beb5424af932af47250a2568eba4c259e3d8 # v1

      - name: Authenticate PAC with GitHub federation
        shell: bash
        run: |
          set -euo pipefail
          pac auth create \
            --tenant "${{ vars.POWERPLATFORM_DEPLOY_TENANT_ID }}" \
            --applicationId "${{ vars.POWERPLATFORM_DEPLOY_CLIENT_ID }}" \
            --githubFederated \
            --environment "${{ vars.POWERPLATFORM_DEPLOY_ENVIRONMENT_URL }}"
          pac auth who

      - name: Validate registered plug-in package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLUGIN_PACKAGE_ID" || {
            echo "POWERPLATFORM_PLUGIN_PACKAGE_ID is required after the one-time PRT registration in DEV." >&2
            echo "Follow docs/19-power-platform-alm.md before using this workflow." >&2
            exit 1
          }

      - name: Build fresh plug-in package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$(dirname "$PLUGIN_PROJECT")"
          rm -rf "$plugin_dir/bin/Release" "$plugin_dir/obj/Release"

          dotnet restore "$PLUGIN_PROJECT" --locked-mode
          dotnet build "$PLUGIN_PROJECT" \
            --configuration Release \
            --no-restore \
            --no-incremental

          mapfile -t packages < <(find "$plugin_dir/bin/Release" -type f -name '*.nupkg' | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one fresh plug-in nupkg, found ${#packages[@]}." >&2
            exit 1
          fi

          contents_file="$RUNNER_TEMP/powerplatform-plugin-package-contents.txt"
          unzip -Z1 "${packages[0]}" > "$contents_file"
          grep -qE '\.dll
      - name: Push registered plug-in package update
        shell: bash
        run: |
          set -euo pipefail
          pac plugin push \
            --pluginId "$PLUGIN_PACKAGE_ID" \
            --pluginFile "${{ steps.plugin.outputs.path }}" \
            --type Nuget \
            --environment "${{ vars.POWERPLATFORM_DEPLOY_ENVIRONMENT_URL }}"

      - name: Locate solution project
        id: solution
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find "$SOLUTION_ROOT" -type f -name '*.cdsproj' | sort)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "Expected exactly one .cdsproj under $SOLUTION_ROOT, found ${#projects[@]}." >&2
            echo "Run scripts/bootstrap-powerplatform-solution.sh in the derived repository." >&2
            exit 1
          fi
          echo "project=${projects[0]}" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "${projects[0]}")" >> "$GITHUB_OUTPUT"

      - name: Restore locked solution project
        run: dotnet restore "${{ steps.solution.outputs.project }}" --locked-mode

      - name: Build solution
        shell: bash
        run: |
          set -euo pipefail

          case "$PACKAGE_TYPE" in
            managed) solution_package_type="Managed" ;;
            unmanaged) solution_package_type="Unmanaged" ;;
            *)
              echo "POWERPLATFORM_SOLUTION_PACKAGE_TYPE must be managed or unmanaged." >&2
              exit 1
              ;;
          esac

          dotnet build "${{ steps.solution.outputs.project }}" \
            --configuration Release \
            --no-restore \
            -p:SolutionPackageType="$solution_package_type"

      - name: Locate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${{ steps.solution.outputs.project_dir }}/bin/Release"
          mapfile -t candidates < <(find "$output_dir" -type f -name '*.zip' | sort)

          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one solution zip under $output_dir, found ${#candidates[@]}." >&2
            printf '%s\n' "${candidates[@]}"
            exit 1
          fi

          echo "path=${candidates[0]}" >> "$GITHUB_OUTPUT"

      - name: Import solution
        shell: bash
        run: |
          set -euo pipefail

          settings_args=()
          if [ -n "$SETTINGS_FILE" ]; then
            test -f "$SETTINGS_FILE" || {
              echo "Power Platform deployment settings file not found: $SETTINGS_FILE" >&2
              exit 1
            }
            settings_args+=(--settings-file "$SETTINGS_FILE")
          fi

          pac solution import \
            --path "${{ steps.package.outputs.path }}" \
            --environment "${{ vars.POWERPLATFORM_DEPLOY_ENVIRONMENT_URL }}" \
            --activate-plugins \
            --publish-changes \
            --async \
            "${settings_args[@]}"
 "$contents_file"
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Push registered plug-in package update
        shell: bash
        run: |
          set -euo pipefail
          pac plugin push \
            --pluginId "$PLUGIN_PACKAGE_ID" \
            --pluginFile "${{ steps.plugin.outputs.path }}" \
            --type Nuget \
            --environment "${{ vars.POWERPLATFORM_DEPLOY_ENVIRONMENT_URL }}"

      - name: Locate solution project
        id: solution
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find "$SOLUTION_ROOT" -type f -name '*.cdsproj' | sort)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "Expected exactly one .cdsproj under $SOLUTION_ROOT, found ${#projects[@]}." >&2
            echo "Run scripts/bootstrap-powerplatform-solution.sh in the derived repository." >&2
            exit 1
          fi
          echo "project=${projects[0]}" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "${projects[0]}")" >> "$GITHUB_OUTPUT"

      - name: Restore locked solution project
        run: dotnet restore "${{ steps.solution.outputs.project }}" --locked-mode

      - name: Build solution
        shell: bash
        run: |
          set -euo pipefail

          case "$PACKAGE_TYPE" in
            managed) solution_package_type="Managed" ;;
            unmanaged) solution_package_type="Unmanaged" ;;
            *)
              echo "POWERPLATFORM_SOLUTION_PACKAGE_TYPE must be managed or unmanaged." >&2
              exit 1
              ;;
          esac

          dotnet build "${{ steps.solution.outputs.project }}" \
            --configuration Release \
            --no-restore \
            -p:SolutionPackageType="$solution_package_type"

      - name: Locate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${{ steps.solution.outputs.project_dir }}/bin/Release"
          mapfile -t candidates < <(find "$output_dir" -type f -name '*.zip' | sort)

          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one solution zip under $output_dir, found ${#candidates[@]}." >&2
            printf '%s\n' "${candidates[@]}"
            exit 1
          fi

          echo "path=${candidates[0]}" >> "$GITHUB_OUTPUT"

      - name: Import solution
        shell: bash
        run: |
          set -euo pipefail

          settings_args=()
          if [ -n "$SETTINGS_FILE" ]; then
            test -f "$SETTINGS_FILE" || {
              echo "Power Platform deployment settings file not found: $SETTINGS_FILE" >&2
              exit 1
            }
            settings_args+=(--settings-file "$SETTINGS_FILE")
          fi

          pac solution import \
            --path "${{ steps.package.outputs.path }}" \
            --environment "${{ vars.POWERPLATFORM_DEPLOY_ENVIRONMENT_URL }}" \
            --activate-plugins \
            --publish-changes \
            --async \
            "${settings_args[@]}"
