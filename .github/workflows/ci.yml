name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate Node script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.mjs' -print0)
      - name: Run tooling regression tests
        run: npm run test:tooling
      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const files = execFileSync("git", ["ls-files", "*.json"], { encoding: "utf8" })
            .split("\n")
            .filter(Boolean);

          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
          }

          console.log(`Validated ${files.length} JSON files.`);
          NODE

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run build:powerapps
      - run: npm run build:powerpages
      - run: npm run build:azure

  azure-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/backends/azure-api/PowerAndAzureAsCode.Api/PowerAndAzureAsCode.Api.csproj --locked-mode
      - run: dotnet build src/backends/azure-api/PowerAndAzureAsCode.Api/PowerAndAzureAsCode.Api.csproj --configuration Release --no-restore

  dataverse-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/PowerAndAzureAsCode.Dataverse.Plugins.csproj --locked-mode
      - run: dotnet build src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/PowerAndAzureAsCode.Dataverse.Plugins.csproj --configuration Release --no-restore
      - name: Verify Dataverse plug-in package
        run: |
          set -euo pipefail
          find src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/bin/Release -type f -name '*.nupkg' -print -quit | grep -q .

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az bicep build --file infra/azure/main.bicep --stdout > /dev/null


  rebrand-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: npm ci --no-audit --no-fund
      - name: Rebrand a disposable checkout
        run: npm run rebrand -- --name "Contoso Workspace" --scope "@contoso" --code-owner "@contoso/platform"
      - name: Verify npm lock consistency after rebrand
        run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run build:powerapps
      - run: npm run build:powerpages
      - run: npm run build:azure
      - name: Verify rebranded .NET projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t azure_projects < <(find src/backends/azure-api -type f -name '*.csproj')
          mapfile -t plugin_projects < <(find src/backends/dataverse -type f -name '*.csproj')

          test "${#azure_projects[@]}" -eq 1
          test "${#plugin_projects[@]}" -eq 1
          grep -q "@contoso/platform" .github/CODEOWNERS
          ! grep -q "@KeyserDSoze" .github/CODEOWNERS

          dotnet restore "${azure_projects[0]}" --locked-mode
          dotnet build "${azure_projects[0]}" -c Release --no-restore
          dotnet restore "${plugin_projects[0]}" --locked-mode
          dotnet build "${plugin_projects[0]}" -c Release --no-restore

          test -z "$(grep -R \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=dist \
            --exclude=packages.lock.json \
            -l 'PowerAndAzureAsCode' src || true)"
