name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate Node script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.mjs' -print0)
      - name: Run tooling regression tests
        run: npm run test:tooling
      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const files = execFileSync("git", ["ls-files", "*.json"], { encoding: "utf8" })
            .split("\n")
            .filter(Boolean);

          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
          }

          console.log(`Validated ${files.length} JSON files.`);
          NODE

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run test:platform
      - run: npm run build:powerapps
      - run: npm run build:powerpages
      - run: npm run build:azure

  azure-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore src/backends/azure-api/PowerAndAzureAsCode.Api/PowerAndAzureAsCode.Api.csproj --locked-mode
      - run: dotnet build src/backends/azure-api/PowerAndAzureAsCode.Api/PowerAndAzureAsCode.Api.csproj --configuration Release --no-restore
      - name: Run Static Web Apps principal smoke tests
        run: dotnet run --project tests/azure-api-auth-smoke/AzureApiAuthSmoke.csproj --configuration Release

  dataverse-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build fresh Dataverse plug-in package
        shell: bash
        run: |
          set -euo pipefail
          project="src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/PowerAndAzureAsCode.Dataverse.Plugins.csproj"
          project_dir="$(dirname "$project")"
          rm -rf "$project_dir/bin/Release" "$project_dir/obj/Release"
          dotnet restore "$project" --locked-mode
          dotnet build "$project" --configuration Release --no-restore --no-incremental

      - name: Verify Dataverse plug-in package contents
        shell: bash
        run: |
          set -euo pipefail
          output_dir="src/backends/dataverse/PowerAndAzureAsCode.Dataverse.Plugins/bin/Release"
          mapfile -t packages < <(find "$output_dir" -type f -name '*.nupkg' | sort)
          test "${#packages[@]}" -eq 1 || {
            echo "Expected exactly one fresh plug-in nupkg, found ${#packages[@]}." >&2
            exit 1
          }
          unzip -Z1 "${packages[0]}" | grep -qE '\.dll
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az bicep build --file infra/azure/main.bicep --stdout > /dev/null


  rebrand-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: npm ci --no-audit --no-fund
      - name: Create derived-solution rebrand fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/backends/dataverse/solution/SmokeSolution
          cat > src/backends/dataverse/solution/SmokeSolution/SmokeSolution.cdsproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <ItemGroup>
              <ProjectReference Include="../../PowerAndAzureAsCode.Dataverse.Plugins/PowerAndAzureAsCode.Dataverse.Plugins.csproj" />
            </ItemGroup>
          </Project>
          EOF
      - name: Rebrand a disposable checkout
        run: npm run rebrand -- --name "Contoso Workspace" --scope "@contoso" --code-owner "@contoso/platform"
      - name: Verify npm lock consistency after rebrand
        run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run test:platform
      - run: npm run build:powerapps
      - run: npm run build:powerpages
      - run: npm run build:azure
      - name: Verify rebranded .NET projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t azure_projects < <(find src/backends/azure-api -type f -name '*.csproj')
          mapfile -t plugin_projects < <(find src/backends/dataverse -type f -name '*.csproj')

          test "${#azure_projects[@]}" -eq 1
          test "${#plugin_projects[@]}" -eq 1
          grep -q "@contoso/platform" .github/CODEOWNERS
          ! grep -q "@KeyserDSoze" .github/CODEOWNERS

          dotnet restore "${azure_projects[0]}" --locked-mode
          dotnet build "${azure_projects[0]}" -c Release --no-restore
          dotnet run --project tests/azure-api-auth-smoke/AzureApiAuthSmoke.csproj -c Release
          plugin_dir="$(dirname "${plugin_projects[0]}")"
          rm -rf "$plugin_dir/bin/Release" "$plugin_dir/obj/Release"
          dotnet restore "${plugin_projects[0]}" --locked-mode
          dotnet build "${plugin_projects[0]}" -c Release --no-restore --no-incremental
          mapfile -t plugin_packages < <(find "$plugin_dir/bin/Release" -type f -name '*.nupkg' | sort)
          test "${#plugin_packages[@]}" -eq 1
          unzip -Z1 "${plugin_packages[0]}" | grep -qE '\.dll            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude-dir=dist \
            --exclude=packages.lock.json \
            -l 'PowerAndAzureAsCode' src tests || true)"


  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
