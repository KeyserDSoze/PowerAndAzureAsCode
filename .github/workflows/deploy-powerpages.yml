name: Deploy Power Pages Code Site

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: choice
        options: [development, test, production]
        default: development
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy-powerpages.yml"

concurrency:
  group: powerplatform-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POWERPAGES_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: npm run build:powerpages
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@0e44beb5424af932af47250a2568eba4c259e3d8 # v1
      - name: Authenticate with GitHub federation
        shell: bash
        run: |
          pac auth create             --tenant "${{ vars.POWERPAGES_TENANT_ID }}"             --applicationId "${{ vars.POWERPAGES_CLIENT_ID }}"             --githubFederated             --environment "${{ vars.POWERPAGES_ENVIRONMENT_URL }}"
          pac auth who
      - name: Upload Code Site
        shell: bash
        run: |
          pac pages upload-code-site             --rootPath src/frontend             --compiledPath src/frontend/dist             --siteName "${{ vars.POWERPAGES_SITE_NAME }}"
