name: Deploy Azure Static Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: choice
        options: [development, test, production]
        default: development
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "azure/**"
      - "scripts/**"
      - ".github/workflows/deploy-azure-frontend.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AZURE_FRONTEND_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    env:
      SWA_AUTH_MODE: ${{ vars.AZURE_SWA_AUTH_MODE || 'preconfigured' }}
      SWA_ENTRA_TENANT_ID: ${{ vars.AZURE_SWA_ENTRA_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:azure
      - name: Deploy prebuilt frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ""
          skip_app_build: true
