name: Configure Azure Dataverse Runtime

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: choice
        options: [development, test, production]
        default: development

concurrency:
  group: azure-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      DATAVERSE_SECRET_NAME: ${{ vars.DATAVERSE_SECRET_NAME || 'dataverse-client-secret' }}
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Dataverse settings on App Service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.DATAVERSE_URL }}"
          test -n "${{ vars.DATAVERSE_RUNTIME_CLIENT_ID }}"
          test -n "${{ vars.DATAVERSE_BOILERPLATE_PING_API_NAME }}"
          test -n "${{ vars.AZURE_KEY_VAULT_NAME }}"

          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_API_WEBAPP_NAME }}" \
            --settings \
              "Dataverse__Url=${{ vars.DATAVERSE_URL }}" \
              "Dataverse__ClientId=${{ vars.DATAVERSE_RUNTIME_CLIENT_ID }}" \
              "Dataverse__ClientSecret=@Microsoft.KeyVault(VaultName=${{ vars.AZURE_KEY_VAULT_NAME }};SecretName=$DATAVERSE_SECRET_NAME)" \
              "Dataverse__BoilerplatePingApiName=${{ vars.DATAVERSE_BOILERPLATE_PING_API_NAME }}" \
            --output none
